name: Marta Backend CI/CD Pipeline

# Tells GitHub when to wake up and run this file.
on:
  push:
    branches: [ "main" ] # Only run when code is pushed directly to the 'main' branch

jobs:
  build-and-test:
    # THE SERVER: Tells GitHub to rent a brand new, blank Linux server in the cloud
    runs-on: ubuntu-latest
    
    # THE INSTRUCTIONS: The exact commands the blank server needs to run
    steps:
      # 1. Download our entire Marta codebase from GitHub onto the blank server's hard drive
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Install Java 21 so the Linux server can actually understand Spring Boot
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Caches internet downloads so future runs are blazingly fast

      # 3. CONTINUOUS INTEGRATION (CI): Run the 14 Mockito tests to prove the code isn't broken
      - name: Run Unit Tests
        working-directory: ./backend # Tell the server to 'cd' into the backend folder
        run: chmod +x mvnw && ./mvnw clean test -Dtest="*Test" -DfailIfNoTests=false

      # 4. CONTINUOUS DEPLOYMENT PREP (CD): Package the tested code into a Docker Blueprint
      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t marta-backend .